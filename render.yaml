services:
  - type: web
    name: nexbyte-sistema
    env: node
    plan: starter
    buildCommand: npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix server install
    startCommand: npm --prefix server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TIMEZONE
        value: America/Argentina/Cordoba
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: nexbyte.ok@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        value: Nexbyte2026!Admin
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
